- name: Install nginx reverse proxy packages
  ansible.builtin.apt:
    name: "{{ nginx_acng_packages }}"
    state: present
    update_cache: true

- name: Ensure TLS directory exists
  ansible.builtin.file:
    path: "{{ nginx_acng_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add apt-cache lab hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\s*{{ apt_cache_server_ip | regex_escape }}\s+.*\b{{ nginx_acng_server_name | regex_escape }}\b'
    line: "{{ apt_cache_server_ip }} {{ nginx_acng_server_name }}"
    state: present

- name: Generate lab CA private key
  ansible.builtin.command:
    cmd: "openssl genrsa -out {{ nginx_acng_ca_key_path }} 4096"
    creates: "{{ nginx_acng_ca_key_path }}"

- name: Generate lab CA certificate
  ansible.builtin.command:
    cmd: "openssl req -x509 -new -nodes -key {{ nginx_acng_ca_key_path }} -sha256 -days 3650 -subj /CN=provcont-lab-ca -out {{ nginx_acng_ca_cert_path }}"
    creates: "{{ nginx_acng_ca_cert_path }}"

- name: Generate apt-cache private key
  ansible.builtin.command:
    cmd: "openssl genrsa -out {{ nginx_acng_tls_key_path }} 2048"
    creates: "{{ nginx_acng_tls_key_path }}"

- name: Generate apt-cache certificate signing request
  ansible.builtin.command:
    cmd: "openssl req -new -key {{ nginx_acng_tls_key_path }} -subj /CN={{ nginx_acng_server_name }} -out {{ nginx_acng_tls_csr_path }}"
    creates: "{{ nginx_acng_tls_csr_path }}"

- name: Configure apt-cache certificate extensions
  ansible.builtin.template:
    src: cert-ext.cnf.j2
    dest: "{{ nginx_acng_tls_ext_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Sign apt-cache certificate with lab CA
  ansible.builtin.command:
    cmd: "openssl x509 -req -in {{ nginx_acng_tls_csr_path }} -CA {{ nginx_acng_ca_cert_path }} -CAkey {{ nginx_acng_ca_key_path }} -CAcreateserial -out {{ nginx_acng_tls_cert_path }} -days 825 -sha256 -extfile {{ nginx_acng_tls_ext_path }}"
    creates: "{{ nginx_acng_tls_cert_path }}"

- name: Protect generated TLS private keys
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - "{{ nginx_acng_ca_key_path }}"
    - "{{ nginx_acng_tls_key_path }}"

- name: Publish lab CA into server trust store
  ansible.builtin.copy:
    src: "{{ nginx_acng_ca_cert_path }}"
    dest: /usr/local/share/ca-certificates/provcont-lab-ca.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Update CA certificates

- name: Configure nginx apt-cache reverse proxy site
  ansible.builtin.template:
    src: apt-cache.nginx.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_acng_site_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx apt-cache site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_acng_site_name }}"
    dest: "/etc/nginx/sites-enabled/{{ nginx_acng_site_name }}"
    state: link
    owner: root
    group: root
  notify: Reload nginx

- name: Disable nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
