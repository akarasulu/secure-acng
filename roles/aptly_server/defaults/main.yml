aptly_packages:
  - aptly
  - ca-certificates
  - curl
  - debian-archive-keyring
  - gnupg
  - gpg
  - nginx
  - openssl

aptly_user: aptly
aptly_group: aptly
aptly_root_dir: /var/lib/aptly
aptly_public_dir: /var/lib/aptly/public
aptly_config_path: /etc/aptly.conf
aptly_domain: aptly.provcont.lan
aptly_server_ip: "{{ ansible_host | default(ansible_default_ipv4.address) }}"
aptly_listen_http: 80
aptly_listen_https: 443
aptly_tls_enabled: true
aptly_tls_dir: "{{ apt_cache_tls_dir }}"
aptly_ca_cert_path: "{{ apt_cache_ca_cert_path }}"
aptly_ca_key_path: "{{ apt_cache_ca_key_path }}"
aptly_tls_cert_path: /etc/ssl/provcont/aptly.crt
aptly_tls_key_path: /etc/ssl/provcont/aptly.key
aptly_tls_csr_path: /etc/ssl/provcont/aptly.csr
aptly_tls_ext_path: /etc/ssl/provcont/aptly.ext
aptly_nginx_site_name: aptly
aptly_api_enabled: false
aptly_api_listen_host: 127.0.0.1
aptly_api_listen_port: 8080
aptly_acng_proxy_url: "http://127.0.0.1:{{ apt_cacher_ng_port | default(3142) }}"
aptly_acng_wrapper_path: /usr/local/bin/aptly-acng
aptly_gnupg_dir: "{{ aptly_root_dir }}/.gnupg"
aptly_debian_archive_keyring: /usr/share/keyrings/debian-archive-keyring.gpg
aptly_exported_archive_keys: "{{ aptly_root_dir }}/debian-archive-keys.gpg"
aptly_trusted_keyring: "{{ aptly_gnupg_dir }}/trustedkeys.gpg"
aptly_official_archive_key_dir: "{{ aptly_root_dir }}/archive-keys"
aptly_official_archive_key_urls:
  - https://ftp-master.debian.org/keys/archive-key-12.asc
  - https://ftp-master.debian.org/keys/archive-key-12-security.asc
  - https://ftp-master.debian.org/keys/archive-key-13.asc
  - https://ftp-master.debian.org/keys/archive-key-13-security.asc
  - https://ftp-master.debian.org/keys/release-13.asc
aptly_manage_mirrors: true
aptly_update_mirrors: false
aptly_mirror_architectures:
  - amd64
aptly_mirror_with_sources: false
aptly_mirrors:
  - name: debian-bookworm
    url: http://deb.debian.org/debian
    distribution: bookworm
    components:
      - main
      - contrib
      - non-free-firmware
  - name: debian-bookworm-updates
    url: http://deb.debian.org/debian
    distribution: bookworm-updates
    components:
      - main
      - contrib
      - non-free-firmware
  - name: debian-bookworm-backports
    url: http://deb.debian.org/debian
    distribution: bookworm-backports
    components:
      - main
      - contrib
      - non-free-firmware
  - name: debian-bookworm-security
    url: http://security.debian.org/debian-security
    distribution: bookworm-security
    components:
      - updates/main
      - updates/contrib
      - updates/non-free-firmware
  - name: debian-trixie
    url: http://deb.debian.org/debian
    distribution: trixie
    components:
      - main
      - contrib
      - non-free-firmware
  - name: debian-trixie-updates
    url: http://deb.debian.org/debian
    distribution: trixie-updates
    components:
      - main
      - contrib
      - non-free-firmware
  - name: debian-trixie-backports
    url: http://deb.debian.org/debian
    distribution: trixie-backports
    components:
      - main
      - contrib
      - non-free-firmware
  - name: debian-trixie-security
    url: http://security.debian.org/debian-security
    distribution: trixie-security
    components:
      - updates/main
      - updates/contrib
      - updates/non-free-firmware
aptly_download_concurrency: 4
aptly_dependency_follow_suggests: false
aptly_dependency_follow_recommends: false
aptly_dependency_follow_all_variants: false
aptly_dependency_follow_source: false
